spring.application.name=alfabetiza-api

# Banco de dados
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/alfabetiza_db}
spring.datasource.username=${DATABASE_USERNAME:alfabetiza_user}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Servidor
server.port=${PORT:8081}
